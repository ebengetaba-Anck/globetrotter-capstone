<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - Ô'MBOA</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="/static/css/register.css">

</head>

<body>

<div class="page">

    <!-- Partie gauche -->

    <section class="left-panel">

        <div class="brand-logo">

            <img src="/static/images/logo.png" alt="Ô'MBOA">

            <div>

                <h1>Ô'MBOA</h1>

                <p>Découvrez Douala autrement</p>

            </div>

        </div>

        <div class="hero-text">

            <h2>

                Rejoignez.<br>
                Explorez.<br>
                <span>Vivez Douala.</span>

            </h2>

            <p>

                Créez votre compte gratuitement et profitez
                de recommandations personnalisées.

            </p>

        </div>

    </section>

    <!-- Partie droite -->

    <section class="right-panel">

        <div class="login-card">

            <div class="logo">

                <img src="/static/images/logo.png" width="70">

                <h1>Créer un compte</h1>

                <p>Bienvenue sur Ô'MBOA</p>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    id="username"
                    type="text"
                    placeholder="Nom d'utilisateur">

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    id="email"
                    type="email"
                    placeholder="Adresse e-mail">

            </div>

            <div class="input-box">

                <i class="fa-solid fa-phone"></i>

                <input
                    id="phone"
                    type="text"
                    placeholder="Téléphone">

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    id="password"
                    type="password"
                    placeholder="Mot de passe">

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirmer le mot de passe">

            </div>

            <button
                class="login-button"
                id="registerBtn">

                Créer mon compte

            </button>

            <p class="register">

                Déjà un compte ?

                <a href="/">

                    Se connecter

                </a>

            </p>

        </div>

    </section>

</div>

<script src="/static/js/register.js"></script>

</body>
</html>
