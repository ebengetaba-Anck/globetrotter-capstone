{% extends "base.html" %}

{% block title %}Découvrir - Ô'MBOA{% endblock %}

{% block content %}

<div class="container py-4">
    <h1 class="mb-2">📍 Découvrir Douala</h1>
    <p class="text-muted mb-4">Explorez les meilleurs lieux de la capitale économique</p>

    <!-- Filtres -->
    <div class="d-flex flex-wrap gap-2 mb-4">
        <button class="filter-btn btn btn-primary btn-sm" onclick="filterDestinations('all')">Tous</button>
        <button class="filter-btn btn btn-outline-secondary btn-sm" onclick="filterDestinations('culture')">🏛️ Culture</button>
        <button class="filter-btn btn btn-outline-secondary btn-sm" onclick="filterDestinations('sortie')">🎉 Sortie</button>
        <button class="filter-btn btn btn-outline-secondary btn-sm" onclick="filterDestinations('nature')">🌿 Nature</button>
        <button class="filter-btn btn btn-outline-secondary btn-sm" onclick="filterDestinations('gastronomie')">🍽️ Gastronomie</button>
        <button class="filter-btn btn btn-outline-secondary btn-sm" onclick="filterDestinations('detente')">🎭 Détente</button>
        <button class="filter-btn btn btn-outline-secondary btn-sm" onclick="filterDestinations('marche')">🛍️ Marché</button>
        <button class="filter-btn btn btn-outline-secondary btn-sm" onclick="filterDestinations('sport')">⚽ Sport</button>
    </div>

    <!-- Grille -->
    <div id="destinations-grid" class="row g-4">
        <div class="col-12 text-center py-5 text-muted"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>
    </div>
</div>

<style>
.destination-card {
    background: white;
    border-radius: 16px;
    border: 1px solid #f1f5f9;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    height: 100%;
    position: relative;
}
.destination-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.06);
}
.destination-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}
.destination-card .fav-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255,255,255,0.9);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.destination-card .fav-btn:hover {
    transform: scale(1.1);
}
.destination-card .fav-btn.favorited {
    color: #dc3545;
}
.destination-card .fav-btn:not(.favorited) {
    color: #94a3b8;
}
.destination-card .info {
    padding: 16px 18px;
}
.destination-card .info h6 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px 0;
}
.destination-card .info .quartier {
    font-size: 13px;
    color: #64748b;
}
.destination-card .info .bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
}
.destination-card .info .bottom .rating {
    font-size: 13px;
    color: #475569;
}
.destination-card .info .bottom .price {
    font-weight: 600;
    color: #2563eb;
}
</style>

<script>
let allDestinations = [];
let currentFilter = 'all';

document.addEventListener('DOMContentLoaded', function() {
    loadDestinations();
});

function loadDestinations() {
    const grid = document.getElementById('destinations-grid');
    grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>';
    
    fetch('/api/destinations')
        .then(r => r.json())
        .then(data => {
            allDestinations = data;
            renderDestinations(data);
        })
        .catch(() => {
            grid.innerHTML = '<div class="col-12 text-center text-danger">Erreur de chargement</div>';
        });
}

function renderDestinations(destinations) {
    const grid = document.getElementById('destinations-grid');
    if (!destinations || destinations.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Aucune destination trouvée.</div>';
        return;
    }

    const token = localStorage.getItem('token');
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

    const html = destinations.map(d => {
        const isFav = favorites.includes(d.id);
        return `
            <div class="col-md-3 col-sm-6">
                <div class="destination-card" onclick="window.location.href='/destination?id=${d.id}'">
                    <img src="/static/images/${d.id}/01.jpg" 
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22180%22%3E%3Crect fill=%22%23f1f5f9%22 width=%22200%22 height=%22180%22/%3E%3Ctext x=%2250%22 y=%2290%22 font-family=%22Arial%22 font-size=%2230%22 fill=%22%2394a3b8%22%3E📸%3C/text%3E%3C/svg%3E'" 
                         alt="${d.name}">
                    <button class="fav-btn ${isFav ? 'favorited' : ''}" 
                            onclick="event.stopPropagation(); toggleFavorite('${d.id}')">
                        <i class="fas fa-heart"></i>
                    </button>
                    <div class="info">
                        <h6>${d.name}</h6>
                        <div class="quartier">${d.quartier || 'Douala'}</div>
                        <div class="bottom">
                            <span class="rating">⭐ ${d.rating || 0} (${d.reviews || 0})</span>
                            <span class="price">${d.avg_cost || 0} FCFA</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');

    grid.innerHTML = html;
}

function filterDestinations(category) {
    currentFilter = category;
    
    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-outline-secondary');
    });
    event.target.classList.remove('btn-outline-secondary');
    event.target.classList.add('btn-primary');

    if (category === 'all') {
        renderDestinations(allDestinations);
    } else {
        const filtered = allDestinations.filter(d => d.category === category);
        renderDestinations(filtered);
    }
}

function toggleFavorite(destId) {
    const token = localStorage.getItem('token');
    if (!token) {
        alert('Connectez-vous pour ajouter aux favoris.');
        window.location.href = '/login';
        return;
    }

    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const index = favorites.indexOf(destId);
    
    if (index > -1) {
        favorites.splice(index, 1);
        alert('❤️ Retiré des favoris');
    } else {
        favorites.push(destId);
        alert('❤️ Ajouté aux favoris !');
    }
    
    localStorage.setItem('favorites', JSON.stringify(favorites));
    
    // Recharger la grille pour mettre à jour les cœurs
    renderDestinations(currentFilter === 'all' ? allDestinations : allDestinations.filter(d => d.category === currentFilter));
}
</script>

{% endblock %}
