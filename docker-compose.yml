version: '3.8'

services:
  user-service:
    build: .
    container_name: omboa-user
    command: python services/user_service.py
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=microservices-secret-key-change-in-prod
      - FLASK_ENV=development
    networks:
      - omboa-network
    restart: unless-stopped

  itinerary-service:
    build: .
    container_name: omboa-itinerary
    command: python services/itinerary_service.py
    ports:
      - "5002:5002"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=microservices-secret-key-change-in-prod
      - FLASK_ENV=development
    networks:
      - omboa-network
    restart: unless-stopped
    depends_on:
      - user-service

  recommendation-service:
    build: .
    container_name: omboa-recommendation
    command: python services/recommendation_service.py
    ports:
      - "5003:5003"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=microservices-secret-key-change-in-prod
      - FLASK_ENV=development
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002
    networks:
      - omboa-network
    restart: unless-stopped
    depends_on:
      - user-service
      - itinerary-service

  chat-service:
    build: .
    container_name: omboa-chat
    command: python services/chat_service.py
    ports:
      - "5004:5004"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=microservices-secret-key-change-in-prod
      - FLASK_ENV=development
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002
    networks:
      - omboa-network
    restart: unless-stopped
    depends_on:
      - user-service
      - itinerary-service
      - recommendation-service

  gateway-service:
    build: .
    container_name: omboa-gateway
    command: python services/gateway_service.py
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./app/templates:/app/app/templates
      - ./app/static:/app/app/static
    environment:
      - SECRET_KEY=microservices-secret-key-change-in-prod
      - FLASK_ENV=development
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5003
      - CHAT_SERVICE_URL=http://chat-service:5004
    networks:
      - omboa-network
    restart: unless-stopped
    depends_on:
      - user-service
      - itinerary-service
      - recommendation-service
      - chat-service

networks:
  omboa-network:
    driver: bridge