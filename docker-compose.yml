version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: services/Dockerfile.user
    container_name: user-service
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
    networks:
      - omboa-network
    restart: unless-stopped
    environment:
      - FLASK_ENV=production

  itinerary-service:
    build:
      context: .
      dockerfile: services/Dockerfile.itinerary
    container_name: itinerary-service
    ports:
      - "5002:5002"
    volumes:
      - ./data:/app/data
    networks:
      - omboa-network
    restart: unless-stopped
    depends_on:
      - user-service
    environment:
      - FLASK_ENV=production

  recommendation-service:
    build:
      context: .
      dockerfile: services/Dockerfile.recommendation
    container_name: recommendation-service
    ports:
      - "5003:5003"
    volumes:
      - ./data:/app/data
    networks:
      - omboa-network
    restart: unless-stopped
    depends_on:
      - user-service
      - itinerary-service
    environment:
      - FLASK_ENV=production
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002

  gateway-service:
    build:
      context: .
      dockerfile: services/Dockerfile.gateway
    container_name: gateway-service
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./app/templates:/app/app/templates
      - ./app/static:/app/app/static
    networks:
      - omboa-network
    restart: unless-stopped
    depends_on:
      - user-service
      - itinerary-service
      - recommendation-service
    environment:
      - FLASK_ENV=production
      - USER_SERVICE=http://user-service:5001
      - ITINERARY_SERVICE=http://itinerary-service:5002
      - RECOMMENDATION_SERVICE=http://recommendation-service:5003

networks:
  omboa-network:
    driver: bridge