<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ô'MBOA - Tableau de bord</title>

    <link rel="stylesheet" href="/static/css/dashboard.css">

</head>


<body>


<header class="navbar">

    <div class="brand">

        <img src="/static/images/logo.png" alt="Ô'MBOA">

        <h1>Ô'MBOA</h1>

    </div>


    <button id="logoutBtn">

        Déconnexion

    </button>


</header>



<section class="welcome">

    <h2>
        Bonjour <span id="username">visiteur</span> 👋
    </h2>

    <p>
        Découvrez les meilleures expériences à Douala.
    </p>

</section>




<section class="cards">


    <div class="card">

        <h3>🌍 Destinations</h3>

        <p>
            Découvrez les lieux incontournables de Douala.
        </p>

    </div>



    <div class="card">

        <h3>🎭 Activités</h3>

        <p>
            Explorez les activités et événements.
        </p>

    </div>



    <div class="card">

        <h3>🗺️ Itinéraires</h3>

        <p>
            Organisez vos parcours personnalisés.
        </p>

    </div>



    <div class="card">

        <h3>🚕 Transport</h3>

        <p>
            Trouvez un moyen de déplacement adapté.
        </p>

    </div>


</section>



<script src="/static/js/dashboard.js"></script>


</body>

</html>
