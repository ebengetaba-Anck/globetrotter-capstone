{% extends "base.html" %}

{% block title %}Mes Favoris - Ô'MBOA{% endblock %}

{% block content %}

<div class="container py-4">
    <h1 class="mb-2">❤️ Mes Favoris</h1>
    <p class="text-muted mb-4">Retrouvez tous les lieux que vous avez aimés.</p>

    <div id="favorites-grid" class="row g-4">
        <div class="col-12 text-center py-5 text-muted"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>
    </div>
</div>

<style>
.fav-card {
    background: white;
    border-radius: 16px;
    border: 1px solid #f1f5f9;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    height: 100%;
}
.fav-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.06);
}
.fav-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }

    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const grid = document.getElementById('favorites-grid');

    if (favorites.length === 0) {
        grid.innerHTML = `
            <div class="col-12 text-center py-5">
                <p class="text-muted">Vous n'avez pas encore de favoris.</p>
                <a href="/destinations" class="btn btn-primary">Découvrir des lieux</a>
            </div>
        `;
        return;
    }

    fetch('/api/destinations')
        .then(r => r.json())
        .then(dests => {
            const favDests = dests.filter(d => favorites.includes(d.id));
            if (favDests.length === 0) {
                grid.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-muted">Aucun favori trouvé.</p>
                        <a href="/destinations" class="btn btn-primary">Découvrir des lieux</a>
                    </div>
                `;
                return;
            }
            grid.innerHTML = favDests.map(d => `
                <div class="col-md-3 col-sm-6">
                    <div class="fav-card" onclick="window.location.href='/destination?id=${d.id}'">
                        <img src="/static/images/${d.id}/01.jpg" onerror="this.style.display='none'" alt="${d.name}">
                        <div class="p-3">
                            <h6 class="mb-0">${d.name}</h6>
                            <small class="text-muted">${d.quartier || 'Douala'}</small>
                            <div class="d-flex justify-content-between mt-2">
                                <span>⭐ ${d.rating || 0} (${d.reviews || 0})</span>
                                <span class="fw-bold text-primary">${d.avg_cost || 0} FCFA</span>
                            </div>
                            <button class="btn btn-outline-danger btn-sm mt-2" 
                                    onclick="event.stopPropagation(); removeFavorite('${d.id}')">
                                <i class="fas fa-trash"></i> Retirer
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        })
        .catch(() => {
            grid.innerHTML = '<div class="col-12 text-center text-danger">Erreur de chargement</div>';
        });
});

function removeFavorite(destId) {
    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    favorites = favorites.filter(id => id !== destId);
    localStorage.setItem('favorites', JSON.stringify(favorites));
    location.reload();
}
</script>

{% endblock %}
