{% extends "base.html" %}

{% block title %}Mon Profil - Ô'MBOA{% endblock %}

{% block content %}
<div style="padding: 40px 24px; max-width: 800px; margin: 0 auto;">
    <h1 style="font-size: 32px; font-weight: 700; color: #0f172a; margin-bottom: 8px;">👤 Mon Profil</h1>
    <p style="color: #64748b; font-size: 16px; margin-bottom: 32px;">Gérez vos informations personnelles</p>

    <div id="profile-content" style="
        background: white;
        border-radius: 20px;
        border: 1px solid #f1f5f9;
        padding: 32px;
    ">
        <div style="text-align: center; padding: 40px; color: #94a3b8;">
            <i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i> Chargement...
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }

    fetch('/api/me', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(r => r.json())
    .then(user => {
        const container = document.getElementById('profile-content');
        container.innerHTML = `
            <div style="display: flex; align-items: center; gap: 24px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #f1f5f9;">
                <div style="
                    width: 80px; height: 80px;
                    border-radius: 50%;
                    background: linear-gradient(135deg, #2563eb, #7c3aed);
                    display: flex; align-items: center; justify-content: center;
                    color: white; font-size: 32px; font-weight: 700;
                ">${(user.username || 'U').charAt(0).toUpperCase()}</div>
                <div>
                    <h2 style="margin: 0; font-size: 24px; font-weight: 700; color: #0f172a;">${user.username || 'Utilisateur'}</h2>
                    <p style="margin: 4px 0 0 0; color: #64748b;">${user.email || 'Email non renseigné'}</p>
                    <span style="display: inline-block; margin-top: 8px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 600; padding: 2px 12px; border-radius: 20px;">Membre</span>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div style="padding: 16px; background: #f8fafc; border-radius: 12px;">
                    <span style="font-size: 12px; color: #94a3b8;">Nom d'utilisateur</span>
                    <div style="font-weight: 600; color: #0f172a;">${user.username || '-'}</div>
                </div>
                <div style="padding: 16px; background: #f8fafc; border-radius: 12px;">
                    <span style="font-size: 12px; color: #94a3b8;">Email</span>
                    <div style="font-weight: 600; color: #0f172a;">${user.email || '-'}</div>
                </div>
                <div style="padding: 16px; background: #f8fafc; border-radius: 12px;">
                    <span style="font-size: 12px; color: #94a3b8;">Membre depuis</span>
                    <div style="font-weight: 600; color: #0f172a;">${user.created_at ? new Date(user.created_at).toLocaleDateString('fr-FR') : '-'}</div>
                </div>
                <div style="padding: 16px; background: #f8fafc; border-radius: 12px;">
                    <span style="font-size: 12px; color: #94a3b8;">Statut</span>
                    <div style="font-weight: 600; color: #166534;">✅ Actif</div>
                </div>
            </div>
            <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid #f1f5f9; display: flex; gap: 12px; flex-wrap: wrap;">
                <button onclick="window.location.href='/my-itineraries'" style="padding: 10px 24px; border-radius: 12px; border: 1px solid #2563eb; background: #2563eb; color: white; font-weight: 600; cursor: pointer; font-family: inherit;">
                    📋 Mes itinéraires
                </button>
                <button onclick="window.location.href='/my-favorites'" style="padding: 10px 24px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; color: #475569; font-weight: 600; cursor: pointer; font-family: inherit;">
                    ❤️ Mes favoris
                </button>
                <button onclick="window.location.href='/transport'" style="padding: 10px 24px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; color: #475569; font-weight: 600; cursor: pointer; font-family: inherit;">
                    🚗 Transport
                </button>
            </div>
        `;
    })
    .catch(() => {
        document.getElementById('profile-content').innerHTML = `
            <div style="text-align:center;padding:40px;color:#94a3b8;">
                <p>⚠️ Erreur de chargement du profil.</p>
                <button onclick="window.location.href='/login'" style="margin-top: 12px; padding: 10px 24px; border-radius: 12px; border: none; background: #2563eb; color: white; font-weight: 600; cursor: pointer; font-family: inherit;">
                    Se reconnecter
                </button>
            </div>
        `;
    });
});
</script>
{% endblock %}
