<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Inscription - Ô'MBOA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .login-card{max-width:420px;width:100%;padding:40px;background:white;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.08);margin:20px}
        .btn-primary{background:#2563eb;border:none;padding:14px;font-weight:600;width:100%;border-radius:12px}
        .btn-primary:hover{background:#1d4ed8}
        .form-control{padding:12px 16px;border-radius:12px;border:1px solid #e2e8f0;font-size:15px}
        .form-control:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
        .logo{text-align:center;margin-bottom:30px}
        .logo h1{font-size:32px;font-weight:800;color:#0f172a}
        .logo h1 span{color:#2563eb}
        .logo p{color:#64748b;font-size:14px}
        .alert{border-radius:12px;font-size:14px}
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo"><h1>Ô'<span>MBOA</span></h1><p>Découvrez Douala autrement</p></div>
    <h3 class="text-center mb-2" style="font-weight:700;">Créer un compte</h3>
    <p class="text-center text-muted mb-4">Rejoignez la communauté des explorateurs.</p>
    <div id="error" class="alert alert-danger" style="display:none;"></div>
    <div id="success" class="alert alert-success" style="display:none;"></div>
    <form id="registerForm">
        <div class="mb-3"><input type="text" id="username" class="form-control" placeholder="Nom d'utilisateur" required></div>
        <div class="mb-3"><input type="email" id="email" class="form-control" placeholder="Email (optionnel)"></div>
        <div class="mb-3"><input type="password" id="password" class="form-control" placeholder="Mot de passe" required></div>
        <button type="submit" class="btn btn-primary">S'inscrire →</button>
    </form>
    <p class="text-center mt-3" style="color:#64748b;">Déjà un compte ? <a href="/login" style="color:#2563eb;font-weight:600;">Se connecter</a></p>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const u=document.getElementById('username').value;
    const em=document.getElementById('email').value;
    const p=document.getElementById('password').value;
    const err=document.getElementById('error');
    const suc=document.getElementById('success');
    err.style.display='none';suc.style.display='none';
    try{
        const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:em,password:p})});
        const d=await r.json();
        if(r.ok){suc.textContent='✅ Compte créé ! Redirection...';suc.style.display='block';setTimeout(()=>{window.location.href='/login';},1500);}
        else{err.textContent=d.error||'Erreur';err.style.display='block';}
    }catch(e){err.textContent='Erreur réseau';err.style.display='block';}
});
</script>
</body>
</html>
